<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>森林数据 · 导航</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      animation: {
        'float': 'float 4s ease-in-out infinite',
        'float-delay': 'float 4s ease-in-out 0.5s infinite',
        'float-slow': 'float 5s ease-in-out infinite',
        'drift': 'drift 20s linear infinite',
        'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
        'fade-up': 'fadeUp 0.8s ease-out forwards',
        'fade-up-delay': 'fadeUp 0.8s ease-out 0.2s forwards',
        'fade-up-delay2': 'fadeUp 0.8s ease-out 0.4s forwards',
        'twinkle': 'twinkle 2s ease-in-out infinite',
      },
      keyframes: {
        float: {
          '0%, 100%': { transform: 'translateY(0)' },
          '50%': { transform: 'translateY(-12px)' },
        },
        drift: {
          '0%': { transform: 'translateX(0)' },
          '50%': { transform: 'translateX(30px)' },
          '100%': { transform: 'translateX(0)' },
        },
        pulseGlow: {
          '0%, 100%': { boxShadow: '0 0 20px rgba(98,197,83,0.2)' },
          '50%': { boxShadow: '0 0 40px rgba(98,197,83,0.5), 0 0 80px rgba(56,189,248,0.2)' },
        },
        fadeUp: {
          '0%': { opacity: '0', transform: 'translateY(30px)' },
          '100%': { opacity: '1', transform: 'translateY(0)' },
        },
        twinkle: {
          '0%, 100%': { opacity: '0.3' },
          '50%': { opacity: '0.7' },
        },
      },
    },
  },
}
</script>
<style>
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(170deg, #0a1628 0%, #0d2818 30%, #0f3d22 60%, #0a1e12 100%);
    overflow-x: hidden;
    color: #e0f0e0;
  }

  /* 星空粒子 */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #a0e0a0;
    animation: twinkle 2s ease-in-out infinite;
  }

  /* 地面雾气 */
  .ground-mist {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 30vh;
    background: linear-gradient(to top, rgba(15,61,34,0.6) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* 卡片玻璃效果 */
  .nav-card {
    position: relative;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    cursor: pointer;
    overflow: hidden;
  }
  .nav-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: -1;
  }
  .nav-card:hover {
    transform: translateY(-8px);
    border-color: rgba(255,255,255,0.25);
  }
  .nav-card:hover::before {
    opacity: 1;
  }

  /* 各卡片主题色 */
  .card-dashboard::before {
    background: radial-gradient(circle at 50% 0%, rgba(255,107,53,0.18) 0%, transparent 70%);
  }
  .card-dashboard:hover {
    box-shadow: 0 24px 48px rgba(0,0,0,0.3), 0 0 60px rgba(255,107,53,0.2);
  }

  .card-achievement::before {
    background: radial-gradient(circle at 50% 0%, rgba(76,175,80,0.18) 0%, transparent 70%);
  }
  .card-achievement:hover {
    box-shadow: 0 24px 48px rgba(0,0,0,0.3), 0 0 60px rgba(76,175,80,0.2);
  }

  .card-guardian::before {
    background: radial-gradient(circle at 50% 0%, rgba(56,189,248,0.18) 0%, transparent 70%);
  }
  .card-guardian:hover {
    box-shadow: 0 24px 48px rgba(0,0,0,0.3), 0 0 60px rgba(56,189,248,0.2);
  }

  .card-userid::before {
    background: radial-gradient(circle at 50% 0%, rgba(206,147,216,0.18) 0%, transparent 70%);
  }
  .card-userid:hover {
    box-shadow: 0 24px 48px rgba(0,0,0,0.3), 0 0 60px rgba(206,147,216,0.2);
  }

  /* 复制成功提示 */
  .copy-toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.2);
    color: #e0f0e0;
    padding: 10px 24px;
    border-radius: 40px;
    font-size: 14px;
    z-index: 999;
    transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
    pointer-events: none;
  }
  .copy-toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* 底部统计 */
  .footer-stats {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-top: 20px;
    opacity: 0;
    animation: fadeUp 0.8s ease-out 0.7s forwards;
  }
  .footer-stats .stat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: rgba(160,200,160,0.5);
  }

  /* 装饰树 */
  .tree-decor {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    opacity: 0.08;
  }

  /* 入场动画关键帧 —— 内联 animation 不会被 Tailwind CDN 扫描到，必须写在这里 */
  @keyframes fadeUp {
    0%   { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(98,197,83,0.2); }
    50%      { box-shadow: 0 0 40px rgba(98,197,83,0.5), 0 0 80px rgba(56,189,248,0.2); }
  }
  @keyframes floatAnim {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50%      { opacity: 0.7; }
  }
  .animate-float      { animation: floatAnim 4s ease-in-out infinite; }
  .animate-float-delay { animation: floatAnim 4s ease-in-out 0.5s infinite; }
  .animate-pulse-glow  { animation: pulseGlow 3s ease-in-out infinite; }

  /* 响应式 */
  @media (max-width: 768px) {
    .cards-grid {
      grid-template-columns: 1fr !important;
    }
  }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-5">

  <!-- 星空背景 -->
  <div class="stars" id="stars"></div>

  <!-- 装饰树 -->
  <div class="tree-decor" style="left:3%;bottom:8%;font-size:180px;">
    <i class="fa-solid fa-tree"></i>
  </div>
  <div class="tree-decor" style="right:2%;bottom:5%;font-size:140px;">
    <i class="fa-solid fa-tree"></i>
  </div>

  <!-- 地面雾气 -->
  <div class="ground-mist"></div>

  <!-- 主容器 -->
  <div class="relative z-10 w-full max-w-4xl mx-auto">
    
    <!-- 标题区 -->
    <div class="text-center mb-10" style="opacity:0;animation:fadeUp 0.8s ease-out forwards;">
      <div class="inline-flex items-center gap-3 mb-3">
        <i class="fa-solid fa-tree text-green-400 text-3xl animate-float"></i>
        <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-green-300 via-emerald-200 to-green-400 bg-clip-text text-transparent">
          森林数据
        </h1>
        <i class="fa-solid fa-seedling text-green-400 text-3xl animate-float-delay"></i>
      </div>
      <p class="text-green-300/60 text-base md:text-lg tracking-wider">
        Forest Data Center
      </p>
      <p class="text-green-200/40 text-sm mt-1">
        选择你想探索的模块
      </p>
    </div>

    <!-- 导航卡片 -->
    <div class="cards-grid grid gap-5 md:gap-6" style="display:grid;grid-template-columns:repeat(2,1fr);">

      <!-- 卡片1：数据榜单 -->
      <a href="data-dashboard.html" class="nav-card card-dashboard rounded-2xl p-6 md:p-8 flex flex-col items-center text-center no-underline"
         style="background:rgba(255,107,53,0.06);opacity:0;animation:fadeUp 0.8s ease-out 0.15s forwards;">
        <div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl flex items-center justify-center mb-5 animate-pulse-glow"
             style="background:linear-gradient(135deg,rgba(255,107,53,0.2),rgba(255,140,90,0.1));">
          <i class="fa-solid fa-chart-bar text-3xl md:text-4xl" style="color:#ff8c5a;"></i>
        </div>
        <h3 class="text-xl md:text-2xl font-bold mb-2" style="color:#ffaa7a;">数据榜单</h3>
        <p class="text-sm md:text-base leading-relaxed" style="color:rgba(200,160,120,0.7);">
          查看森林能量数据排行榜<br>了解好友绿色贡献排名
        </p>
        <span class="inline-flex items-center gap-1 mt-4 text-sm font-medium rounded-full px-4 py-1.5 transition-all duration-300"
              style="background:rgba(255,107,53,0.12);color:#ffaa7a;border:1px solid rgba(255,107,53,0.2);">
          进入 <i class="fa-solid fa-arrow-right text-xs"></i>
        </span>
      </a>

      <!-- 卡片2：成就墙 -->
      <a href="forest-achievement.html" class="nav-card card-achievement rounded-2xl p-6 md:p-8 flex flex-col items-center text-center no-underline"
         style="background:rgba(76,175,80,0.06);opacity:0;animation:fadeUp 0.8s ease-out 0.3s forwards;">
        <div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl flex items-center justify-center mb-5 animate-pulse-glow"
             style="background:linear-gradient(135deg,rgba(76,175,80,0.2),rgba(129,199,132,0.1));">
          <i class="fa-solid fa-trophy text-3xl md:text-4xl" style="color:#81c784;"></i>
        </div>
        <h3 class="text-xl md:text-2xl font-bold mb-2" style="color:#a5d6a7;">成就墙</h3>
        <p class="text-sm md:text-base leading-relaxed" style="color:rgba(150,200,150,0.7);">
          浏览森林种植成就徽章<br>记录每一份绿色贡献
        </p>
        <span class="inline-flex items-center gap-1 mt-4 text-sm font-medium rounded-full px-4 py-1.5 transition-all duration-300"
              style="background:rgba(76,175,80,0.12);color:#a5d6a7;border:1px solid rgba(76,175,80,0.2);">
          进入 <i class="fa-solid fa-arrow-right text-xs"></i>
        </span>
      </a>

      <!-- 卡片3：绿色能量榜 -->
      <a href="forest-guardian.html" class="nav-card card-guardian rounded-2xl p-6 md:p-8 flex flex-col items-center text-center no-underline"
         style="background:rgba(56,189,248,0.06);opacity:0;animation:fadeUp 0.8s ease-out 0.45s forwards;">
        <div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl flex items-center justify-center mb-5 animate-pulse-glow"
             style="background:linear-gradient(135deg,rgba(56,189,248,0.2),rgba(130,210,255,0.1));">
          <i class="fa-solid fa-shield-haltered text-3xl md:text-4xl" style="color:#4fc3f7;"></i>
        </div>
        <h3 class="text-xl md:text-2xl font-bold mb-2" style="color:#81d4fa;">绿色能量榜</h3>
        <p class="text-sm md:text-base leading-relaxed" style="color:rgba(130,200,230,0.7);">
          蚂蚁森林守护者排行榜<br>查看能量收集与守护数据
        </p>
        <span class="inline-flex items-center gap-1 mt-4 text-sm font-medium rounded-full px-4 py-1.5 transition-all duration-300"
              style="background:rgba(56,189,248,0.12);color:#81d4fa;border:1px solid rgba(56,189,248,0.2);">
          进入 <i class="fa-solid fa-arrow-right text-xs"></i>
        </span>
      </a>

      <!-- 卡片4：获取用户ID（点击复制链接） -->
      <div class="nav-card card-userid rounded-2xl p-6 md:p-8 flex flex-col items-center text-center cursor-pointer"
           style="background:rgba(206,147,216,0.06);opacity:0;animation:fadeUp 0.8s ease-out 0.6s forwards;"
           onclick="copyGetUserIdUrl(this)">
        <div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl flex items-center justify-center mb-5 animate-pulse-glow"
             style="background:linear-gradient(135deg,rgba(206,147,216,0.2),rgba(225,190,231,0.1));">
          <i class="fa-solid fa-fingerprint text-3xl md:text-4xl" style="color:#ce93d8;"></i>
        </div>
        <h3 class="text-xl md:text-2xl font-bold mb-2" style="color:#e1bee7;">获取用户ID</h3>
        <p class="text-sm md:text-base leading-relaxed" style="color:rgba(200,170,210,0.7);">
          快速获取蚂蚁森林用户ID<br>点击复制分享链接
        </p>
        <span class="copy-badge inline-flex items-center gap-1 mt-4 text-sm font-medium rounded-full px-4 py-1.5 transition-all duration-300"
              style="background:rgba(206,147,216,0.12);color:#e1bee7;border:1px solid rgba(206,147,216,0.2);">
          <i class="fa-solid fa-copy text-xs"></i> 点击复制链接
        </span>
      </div>

    </div>

    <!-- 底部统计 -->
    <div class="footer-stats">
      <div class="stat-item">
        <i class="fa-solid fa-eye"></i>
        <span>本页访问：</span>
        <span id="footerVisits">--</span>
        <span>次</span>
      </div>
      <span style="color:rgba(160,200,160,0.25);">|</span>
      <div class="stat-item">
        <i class="fa-solid fa-globe"></i>
        <span>总访问：</span>
        <span id="footerTotalVisits">--</span>
        <span>次</span>
      </div>
    </div>

    <!-- 底部装饰 -->
    <div class="text-center mt-8" style="opacity:0;animation:fadeUp 0.8s ease-out 0.6s forwards;">
      <div class="flex items-center justify-center gap-2 text-green-300/20 text-xs">
        <span class="inline-block w-8 h-px bg-green-300/20"></span>
        <i class="fa-solid fa-leaf"></i>
        <span>每一克能量，都是对地球的守护</span>
        <i class="fa-solid fa-leaf"></i>
        <span class="inline-block w-8 h-px bg-green-300/20"></span>
      </div>
    </div>

  </div>

  <!-- 复制成功提示 -->
  <div class="copy-toast" id="copyToast">
    <i class="fa-solid fa-check-circle" style="color:#a5d6a7;"></i>
    &nbsp;链接已复制到剪贴板
  </div>

  <script>
    // 生成星空粒子
    (function() {
      var starsEl = document.getElementById('stars');
      var count = 60;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < count; i++) {
        var star = document.createElement('div');
        star.className = 'star';
        var size = Math.random() * 2.5 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        star.style.animationDuration = (Math.random() * 2 + 2) + 's';
        star.style.opacity = Math.random() * 0.4 + 0.15;
        frag.appendChild(star);
      }
      starsEl.appendChild(frag);
    })();

    // 复制 getUserId 链接
    function copyGetUserIdUrl(el) {
      var url = window.location.origin + '/getUserId.html';
      var badge = el.querySelector('.copy-badge');
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function() {
          showCopyToast();
          updateCopyBadge(badge);
        }).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }

      function fallbackCopy() {
        var ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
          var ok = document.execCommand('copy');
          if (ok) {
            showCopyToast();
            updateCopyBadge(badge);
          }
        } catch(e) {}
        document.body.removeChild(ta);
      }
    }

    function showCopyToast() {
      var toast = document.getElementById('copyToast');
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(function() {
        toast.classList.remove('show');
      }, 2000);
    }

    function updateCopyBadge(badge) {
      badge.innerHTML = '<i class="fa-solid fa-check text-xs"></i> 已复制';
      badge.style.color = '#a5d6a7';
      badge.style.background = 'rgba(76,175,80,0.15)';
      badge.style.borderColor = 'rgba(76,175,80,0.3)';
      setTimeout(function() {
        badge.innerHTML = '<i class="fa-solid fa-copy text-xs"></i> 点击复制链接';
        badge.style.color = '#e1bee7';
        badge.style.background = 'rgba(206,147,216,0.12)';
        badge.style.borderColor = 'rgba(206,147,216,0.2)';
      }, 2500);
    }

    // 访问量统计
    (function() {
      var visitEl = document.getElementById('footerVisits');
      var totalEl = document.getElementById('footerTotalVisits');

      function fetchVisits() {
        fetch('/api/visits')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (visitEl) visitEl.textContent = data['index.html'] || 0;
            if (totalEl) {
              var total = 0;
              for (var k in data) { total += data[k] || 0; }
              totalEl.textContent = total;
            }
          })
          .catch(function() {
            if (visitEl) visitEl.textContent = '--';
            if (totalEl) totalEl.textContent = '--';
          });
      }

      fetch('/api/increment?page=index.html')
        .then(function(r) { return r.json(); })
        .then(fetchVisits)
        .catch(fetchVisits);
    })();
  </script>

</body>
</html>
